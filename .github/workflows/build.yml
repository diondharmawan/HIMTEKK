name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

  #    - name: Set up Go
  #      uses: actions/setup-go@v4
  #      with:
  #        go-version: 1.17

   #   - name: Build
   #     run: go build -v ./...

   #   - name: Test
   #     run: go test -v ./...

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          push: true
          tags: diondharmawan/himtekk:latest
